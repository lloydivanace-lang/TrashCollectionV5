<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>

    <!-- Ambient Shadow -->
    <radialGradient id="canFloorShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#000000" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Realistic Metallic Can Body Gradient -->
    <linearGradient id="canBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="15%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="88%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Lid Metallic Gradient -->
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="20%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="75%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Handle Chrome Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Flute/Rib Highlight & Shadow -->
    <linearGradient id="fluteHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fluteShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner Bottom Base Gradient -->
    <linearGradient id="baseRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Floor Shadow Under Can -->
  <ellipse cx="256" cy="426" rx="135" ry="24" fill="url(#canFloorShadow)"/>

  <!-- Bottom Rim Base of Trash Can -->
  <path d="M178 396 L334 396 Q338 412 330 415 L182 415 Q174 412 178 396 Z" fill="url(#baseRimGrad)"/>

  <!-- Main Tapered Metallic Cylinder Can Body -->
  <path d="M166 182 L346 182 L332 398 Q332 404 324 404 L188 404 Q180 404 180 398 Z" fill="url(#canBodyGrad)"/>

  <!-- Soft 3D Cylindrical Shadow Overlay on Right Side -->
  <path d="M295 182 L346 182 L332 398 Q332 404 324 404 L295 404 Z" fill="#0f172a" opacity="0.18"/>

  <!-- Realistic Vertical Ribs / Corrugation (Light & Shadow pairs) -->
  <!-- Rib 1 -->
  <rect x="198" y="196" width="3" height="192" rx="1.5" fill="url(#fluteHighlight)"/>
  <rect x="201" y="196" width="4" height="192" rx="2" fill="url(#fluteShadow)"/>

  <!-- Rib 2 -->
  <rect x="226" y="196" width="3.5" height="192" rx="1.5" fill="url(#fluteHighlight)"/>
  <rect x="229.5" y="196" width="4" height="192" rx="2" fill="url(#fluteShadow)"/>

  <!-- Rib 3 (Center) -->
  <rect x="254" y="196" width="4" height="192" rx="2" fill="url(#fluteHighlight)"/>
  <rect x="258" y="196" width="4.5" height="192" rx="2" fill="url(#fluteShadow)"/>

  <!-- Rib 4 -->
  <rect x="282" y="196" width="3.5" height="192" rx="1.5" fill="url(#fluteHighlight)"/>
  <rect x="285.5" y="196" width="4" height="192" rx="2" fill="url(#fluteShadow)"/>

  <!-- Rib 5 -->
  <rect x="310" y="196" width="3" height="192" rx="1.5" fill="url(#fluteHighlight)"/>
  <rect x="313" y="196" width="4" height="192" rx="2" fill="url(#fluteShadow)"/>

  <!-- Horizontal Body Accent Rings (Adds Realism & Sturdiness) -->
  <line x1="174" y1="230" x2="338" y2="230" stroke="#f8fafc" stroke-width="2.5" opacity="0.6"/>
  <line x1="174" y1="232" x2="338" y2="232" stroke="#334155" stroke-width="2" opacity="0.4"/>

  <line x1="178" y1="360" x2="334" y2="360" stroke="#f8fafc" stroke-width="2.5" opacity="0.6"/>
  <line x1="178" y1="362" x2="334" y2="362" stroke="#334155" stroke-width="2" opacity="0.4"/>

  <!-- Side Handle Left -->
  <path d="M167 255 C146 255 146 285 169 285" fill="none" stroke="url(#handleGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Side Handle Right -->
  <path d="M345 255 C366 255 366 285 343 285" fill="none" stroke="url(#handleGrad)" stroke-width="8" stroke-linecap="round"/>

  <!-- Trash Can Lid Overhang Lip Shadow -->
  <ellipse cx="256" cy="186" rx="98" ry="12" fill="#0f172a" opacity="0.4"/>

  <!-- Lid Bottom Lip (Slightly wider than can body) -->
  <rect x="150" y="162" width="212" height="22" rx="9" fill="url(#lidGrad)"/>
  <!-- Lid Lip Specular Glint -->
  <line x1="158" y1="166" x2="354" y2="166" stroke="#ffffff" stroke-width="2.5" opacity="0.8"/>

  <!-- Lid Dome Top -->
  <path d="M168 163 C180 142 220 134 256 134 C292 134 332 142 344 163 Z" fill="url(#lidGrad)"/>
  <!-- Lid Dome Top Highlight Curve -->
  <path d="M185 158 C205 144 235 138 256 138 C277 138 307 144 327 158" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75" stroke-linecap="round"/>

  <!-- Top Handle Stanchions / Mounts -->
  <rect x="224" y="128" width="10" height="9" rx="2" fill="#475569"/>
  <rect x="278" y="128" width="10" height="9" rx="2" fill="#475569"/>

  <!-- Realistic Arched Top Lid Handle with 3D Chrome Shading -->
  <path d="M228 132 C228 106 284 106 284 132" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <path d="M228 132 C228 108 284 108 284 132" fill="none" stroke="url(#handleGrad)" stroke-width="9" stroke-linecap="round"/>
  <path d="M234 125 C236 114 276 114 278 125" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>
</svg>
